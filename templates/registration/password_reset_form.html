{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Reset password — CrateWise{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h1>Reset your password</h1>
        <p class="sub">Enter your account email and we'll send you a reset link.</p>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Send reset link</button>
        </form>
        <div class="mt-3 small"><a href="{% url 'login' %}">Back to login</a></div>
    </div>
</div>
{% endblock %}
