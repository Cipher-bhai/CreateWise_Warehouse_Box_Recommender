{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Sign up — CrateWise{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h1>Create your account</h1>
        <p class="sub">New accounts start as <strong>Staff</strong> — an Admin can promote you later.</p>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Sign up</button>
        </form>
        <div class="mt-3 small">
            Already have an account? <a href="{% url 'login' %}">Log in</a>
        </div>
    </div>
</div>
{% endblock %}
