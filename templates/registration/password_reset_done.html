{% extends "base.html" %}
{% block title %}Check your email — CrateWise{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card text-center">
        <h1><i class="bi bi-envelope-check text-primary"></i></h1>
        <h1>Check your inbox</h1>
        <p class="sub">If an account exists with that email, we've sent password reset instructions.</p>
        <a href="{% url 'login' %}" class="btn btn-outline-primary w-100">Back to login</a>
    </div>
</div>
{% endblock %}
