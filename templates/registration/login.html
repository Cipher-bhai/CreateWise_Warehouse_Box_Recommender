{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Login — CrateWise{% endblock %}
{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h1>Welcome back</h1>
        <p class="sub">Log in to your CrateWise account.</p>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-2">Log in</button>
        </form>
        <div class="d-flex justify-content-between mt-3 small">
            <a href="{% url 'password_reset' %}">Forgot password?</a>
            <a href="{% url 'signup' %}">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
