{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}{% if object %}Edit Product{% else %}Add Product{% endif %} — CrateWise{% endblock %}
{% block content %}
<div class="container px-4 py-4" style="max-width:560px;">
    <a href="{% url 'product-list' %}" class="small d-inline-block mb-3"><i class="bi bi-arrow-left me-1"></i>Back to products</a>
    <div class="card stat-card p-4">
        <h2 class="fw-bold mb-4">{% if object %}Edit Product{% else %}Add Product{% endif %}</h2>
        {% crispy form %}
    </div>
</div>
{% endblock %}
