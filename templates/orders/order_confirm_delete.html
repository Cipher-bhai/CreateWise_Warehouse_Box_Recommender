{% extends "base.html" %}
{% block title %}Delete Order — CrateWise{% endblock %}
{% block content %}
<div class="container px-4 py-4" style="max-width:480px;">
    <div class="card stat-card p-4">
        <h2 class="fw-bold mb-3">Delete Order #{{ object.id }}?</h2>
        <p class="text-muted">This action cannot be undone.</p>
        <form method="post">
            {% csrf_token %}
            <a href="{% url 'order-list' %}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-danger">Delete</button>
        </form>
    </div>
</div>
{% endblock %}
