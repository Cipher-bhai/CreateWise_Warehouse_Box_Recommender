{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Edit User — CrateWise{% endblock %}
{% block content %}
<div class="container px-4 py-4" style="max-width:480px;">
    <a href="{% url 'user-list' %}" class="small d-inline-block mb-3"><i class="bi bi-arrow-left me-1"></i>Back to users</a>
    <div class="card stat-card p-4">
        <h2 class="fw-bold mb-1">Edit role — {{ object.username }}</h2>
        <p class="text-muted small mb-4">Changing a user's role changes what they can access immediately.</p>
        {% crispy form %}
    </div>
</div>
{% endblock %}
